# REUSE configuration (https://reuse.software, spec 3.3+)
#
# Supplies SPDX-FileCopyrightText (and a license fallback) for authored files so
# contributors only need the inline SPDX-License-Identifier header that
# scripts/check-spdx.sh enforces. precedence = "override" is NOT used: inline
# license headers stay authoritative; these annotations fill the copyright gap and
# supply a license only where a file has none.
#
# third_party/ vendored SOURCES are deliberately NOT covered here — each vendored
# subtree carries its own upstream license/headers and its own METADATA. Only our
# own third_party bookkeeping files (METADATA, README) are annotated below.
version = 1

[[annotations]]
path = [
  "src/**",
  "hosts/**",
  "framework/**",  # acl-authored android.* shims + boot-classpath build (vendored AOSP under third_party/)
  "tests/**",
  "tools/**",
  "scripts/**",
  "specs/**",
  "docs/**",
  "cross/**",
  ".github/**",
  "subprojects/README.md",
  "meson.build",
  "meson.options",
  "REUSE.toml",
  "LICENSE",
  "NOTICE",
  "**.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 Contributors to a4l"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".gitignore", "**/.gitignore", "**/.gitkeep", "**.wrap", "**.ini",
        ".git-blame-ignore-revs", ".clang-format-version"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 Contributors to a4l"
SPDX-License-Identifier = "Apache-2.0"

# .clang-format is taken verbatim from toyota-connected/ivi-homescreen (Apache-2.0), which
# derives it from Chromium's style. It is kept byte-identical to that file so it stays
# diffable against its origin, which is why the attribution lives here rather than as a
# comment header inside it.
[[annotations]]
path = [".clang-format"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2020 Toyota Connected North America"
SPDX-License-Identifier = "Apache-2.0"

# Our own bookkeeping inside third_party/ (not the vendored code itself).
[[annotations]]
path = ["third_party/README.md", "third_party/**/METADATA"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 Contributors to a4l"
SPDX-License-Identifier = "Apache-2.0"

# The pinned AOSP manifest is 'repo manifest -r' output: AOSP's own project list with a
# commit recorded per project. The project names and structure are upstream's, so it is
# attributed to AOSP rather than to this repository, even though acl generated the file.
[[annotations]]
path = ["tools/aosp/manifests/*.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# Vendored Wayland shell protocol definitions (unmodified upstream XML, MIT). Consumed by
# the wcs scanner to generate the agl/ivi/fullscreen client bindings for ACL_WL_SHELL. Each
# carries its own upstream copyright in-file; declared here for REUSE. Origins in METADATA.
[[annotations]]
path = ["third_party/wayland-protocols/*.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright © 2019, 2022 Collabora, Ltd.",
  "Copyright (C) 2013 DENSO CORPORATION",
  "Copyright (c) 2013 BMW Car IT GmbH",
  "Copyright © 2016 Yong Bakos",
  "Copyright © 2015 Jason Ekstrand",
]
SPDX-License-Identifier = "MIT"

# Vendored AOSP frameworks/base sources (ADR-0002 content layer). Unmodified upstream
# files whose api-33 headers may predate machine-readable SPDX tags; the license is
# declared here (idiomatic REUSE for third-party code) and audited per file in
# third_party/aosp/frameworks/MANIFEST.md. tools/vendor_framework.py verifies each
# copied file carries an Apache-2.0 header before vendoring it.
[[annotations]]
path = ["third_party/aosp/frameworks/**.java"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"
