#
# Meson cross file for Qualcomm SA8155P (aarch64, Adreno / Freedreno+Turnip target).
# Template — set the toolchain prefix and sysroot for your board bring-up.
#   meson setup build-sa8155p --cross-file cross/sa8155p.ini

[constants]
prefix = 'aarch64-linux-gnu-'
sysroot = '/opt/sysroots/sa8155p'   # <-- set to your target sysroot

[binaries]
c        = prefix + 'gcc'
cpp      = prefix + 'g++'
ar       = prefix + 'ar'
strip    = prefix + 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_args   = ['--sysroot=' + sysroot]
cpp_args = ['--sysroot=' + sysroot]
c_link_args   = ['--sysroot=' + sysroot]
cpp_link_args = ['--sysroot=' + sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'kryo485'
endian     = 'little'
