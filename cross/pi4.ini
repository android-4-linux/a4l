# Provenance: original build configuration. No GPL-3.0 sources.
#
# Meson cross file for Raspberry Pi 4 (BCM2711, aarch64 Cortex-A72, VideoCore VI / Mesa V3DV
# Vulkan). Also serves the Pi 5 (BCM2712, Cortex-A76, VideoCore VII) — copy this and set
# cpu = 'cortex-a76'. Fill in the triple prefix + sysroot, then:
#   meson setup build-pi4 --cross-file cross/pi4.ini
#   meson compile -C build-pi4
#
# This is a template: point sysroot at a Pi OS Bookworm (or Debian arm64) sysroot that carries the
# dev packages acl links — wayland-client, libpipewire-0.3, the Vulkan loader/headers, fmt,
# sdbus-c++ (optional), and the FFmpeg headers (libav{codec,format,util}, libswresample; the libs
# are dlopen'd at runtime, headers are needed to compile SoundPool). See docs/pi-plan.md §P-A.

[constants]
prefix = 'aarch64-linux-gnu-'
sysroot = '/opt/sysroots/pi4'   # <-- set to your Pi OS Bookworm arm64 sysroot

[binaries]
c        = prefix + 'gcc'
cpp      = prefix + 'g++'
ar       = prefix + 'ar'
strip    = prefix + 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_args   = ['--sysroot=' + sysroot]
cpp_args = ['--sysroot=' + sysroot]
c_link_args   = ['--sysroot=' + sysroot]
cpp_link_args = ['--sysroot=' + sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'cortex-a72'
endian     = 'little'
