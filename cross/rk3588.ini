# Provenance: original build configuration. No GPL-3.0 sources.
#
# Meson cross file for Rockchip RK3588 (aarch64, Mali-G610). Mesa GPU stack: the Panthor kernel
# DRM driver + PanVk (Mesa's Vulkan driver for Valhall Mali), NOT RADV (RADV is AMD-only). The
# proprietary Mali blob is the alternative; if used, dlopen it (do not link) like the graphics lib.
# Fill in the triple prefix for your sysroot/toolchain, then:
#   meson setup build-rk3588 --cross-file cross/rk3588.ini
#
# This is a template: adjust paths to your actual cross toolchain and sysroot.

[constants]
prefix = 'aarch64-linux-gnu-'
sysroot = '/opt/sysroots/rk3588'   # <-- set to your target sysroot

[binaries]
c        = prefix + 'gcc'
cpp      = prefix + 'g++'
ar       = prefix + 'ar'
strip    = prefix + 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_args   = ['--sysroot=' + sysroot]
cpp_args = ['--sysroot=' + sysroot]
c_link_args   = ['--sysroot=' + sysroot]
cpp_link_args = ['--sysroot=' + sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = sysroot + '/usr/lib/pkgconfig:' + sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'cortex-a76'
endian     = 'little'
