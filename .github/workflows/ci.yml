# Provenance: plan.md §4 Phase 0 / Gate G0. No GPL-3.0 sources.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Clean-room & license gates (Gate G0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install REUSE
        run: pipx install reuse
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: Forbidden licenses (GPL-3.0 family)
        run: ./scripts/check-licenses.sh
      - name: Clean-room provenance (denylist + provenance comments)
        run: ./scripts/check-provenance.sh
      - name: REUSE lint
        run: reuse lint

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is Signed-off-by
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "FAIL: commit $sha missing DCO Signed-off-by" >&2
              bad=1
            fi
          done < <(git rev-list "$range")
          exit $bad

  # This job builds the configuration a bare runner can reach: no pinned Skia, so no Ganesh
  # Vulkan, and no wcs checkout, so wm/ is the stub presenter. The Skia + Vulkan + wcs
  # configuration -- the one that actually presents an app -- needs a 151 MB prebuilt Skia m150
  # prefix and is NOT covered here. Adding it means caching that prefix; until then, a green run
  # means the stub configuration compiles and its tests pass, nothing more.
  build:
    name: Build & test (Meson, stub presenter / no Skia)
    runs-on: ubuntu-latest
    # A hung mirror once held Install toolchain open for 87 minutes with no output. The job
    # cap bounds the damage; the step cap and the per-attempt timeout below are what actually
    # turn a hang into a retry.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # The runner's mirror list periodically serves an index whose pool has already moved on.
        # Two failure modes, both infrastructure rather than build: every fetch 404s ("Unable to
        # fetch some archives"), or the mirror accepts the connection and never answers. Re-running
        # update before each attempt picks up the rotated mirror; the Acquire timeouts and the
        # outer `timeout` bound the silent case, which retries alone cannot reach.
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            timeout 240 sudo apt-get update -qq $apt_opts || true
            # shellcheck disable=SC2086
            if timeout 240 sudo apt-get install -y $apt_opts \
                 meson ninja-build g++ pkg-config \
                 libfmt-dev zlib1g-dev python3 default-jdk; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying"
            sleep 15
          done
          echo "apt failed three times" >&2
          exit 1
      - name: Export JAVA_HOME for the JVM backend detection
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> "$GITHUB_ENV"
      - name: Fetch Catch2 (Tier A tests)
        run: meson wrap install catch2 || true
      - name: Configure (automotive profile, default ON)
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Run the stub
        run: ./build/src/shell/acl
      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Configure phone profile
        run: meson setup build-phone -Dprofile_automotive=false
      - name: Compile phone profile
        run: meson compile -C build-phone
      - name: Automotive nm-diff gate (symbols present when ON, absent when OFF)
        run: scripts/check-automotive-symbols.sh build build-phone
